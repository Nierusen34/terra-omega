name: GitHub Pages smoke test

on:
  page_build:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terra-omega-pages-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7

      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Wait for GitHub Pages and run smoke test
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          npm run test:smoke -- --url "https://${OWNER}.github.io/${REPO_NAME}/" --wait 180
